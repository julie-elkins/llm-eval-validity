[project]
name = "llm-eval-validity"
version = "0.1.0"
description = "A validity and reliability study of an LLM evaluation harness, run the way a certification exam is validated"
requires-python = ">=3.13"
# The offline analysis has no dependencies at all. Every statistic this repo turns on --
# Wilson intervals, Newcombe differences, point-biserial correlation, Cohen's kappa,
# Krippendorff's alpha -- is implemented in `validity/` rather than imported, because a
# study whose subject is "was this measurement trustworthy" should not ask the reader to
# take its own measurements on faith. Each is tested against a worked example from the
# literature with the expected value hard-coded, so the implementations are checkable
# rather than merely conventional.
dependencies = []

[project.optional-dependencies]
# Only the LLM-judge stage needs the network. Everything else runs offline, and `make analyse`
# deliberately does not depend on this group -- every number in the committed reports except the
# judge agreement figures is reproducible with no credentials at all.
#
# The bedrock extra rather than the plain SDK: the source project ran on Bedrock and the judge
# runs there too, on the same account and region, so the judge's own inference path is not a
# new uncontrolled variable in a study about measurement error. It also means the credential
# is an IAM role rather than a long-lived API key.
#
# Pinned to 1.2 rather than any 1.x because the 1.x line is where sampling parameters left the
# Python SDK entirely -- `temperature` is a TypeError, not a rejected request -- and the judge's
# reproducibility measurements only mean anything if the reader can reproduce that constraint.
judge = ["anthropic[bedrock]>=1.2"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["validity*"]
